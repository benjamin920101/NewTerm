name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Procursus
        uses: beerpiss/procursus-action@v2
        with:
          packages: ldid xz-utils cmark make
          cache: true
          cache-path: ~/__cache

      - name: Set up Theos
        run: git clone --recursive --depth=1 'https://github.com/roothide/theos.git' ~/theos

      - name: Compile
        id: package_build
        run: |
          gmake package THEOS=~/theos ROOTHIDE=1
          echo "package=$(cat .theos/last_package)" >> $GITHUB_OUTPUT

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewTerm3
          path: '${{ steps.package_build.outputs.package }}'

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: "NewTerm3 Pre-release"
          tag_name: "pre-${{ github.run_number }}"
          prerelease: true
          files: '${{ steps.package_build.outputs.package }}'
          generate_release_notes: true
